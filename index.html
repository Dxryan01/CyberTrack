
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberTrack | Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Cyber<span>Track</span></div>
        <div class="status">● SYSTEM ONLINE</div>
    </header>

    <main class="container">
        <section class="hero">
            <p class="eyebrow">CYBERSECURITY LEARNING HUB</p>
            <h1>Mon espace de progression</h1>
            <p class="subtitle">
                Organise tes CTF, tes cours et tes objectifs en cybersécurité.
            </p>
        </section>

        <section class="stats-grid">
            <article class="stat-card">
                <span>Total</span>
                <strong id="total-count">0</strong>
            </article>

            <article class="stat-card">
                <span>En cours</span>
                <strong id="progress-count">0</strong>
            </article>

            <article class="stat-card">
                <span>Terminés</span>
                <strong id="completed-count">0</strong>
            </article>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Ajouter une activité</h2>
            </div>

            <form id="activity-form">
                <div class="form-group">
                    <label for="activity-name">Nom de l'activité</label>
                    <input
                        type="text"
                        id="activity-name"
                        placeholder="Ex : TryHackMe - Mustacchio"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="activity-type">Catégorie</label>
                    <select id="activity-type">
                        <option value="CTF">CTF</option>
                        <option value="Cours">Cours</option>
                        <option value="Notion">Notion</option>
                        <option value="Projet">Projet</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="activity-status">Statut</label>
                    <select id="activity-status">
                        <option value="todo">À faire</option>
                        <option value="progress">En cours</option>
                        <option value="completed">Terminé</option>
                    </select>
                </div>

                <button type="submit">+ Ajouter l'activité</button>
            </form>
        </section>

        <section class="panel">
            <div class="panel-header">
                <h2>Mes activités</h2>
            </div>

            <div id="activity-list" class="activity-list">
                <p class="empty-message">
                    Aucune activité pour le moment.
                </p>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
